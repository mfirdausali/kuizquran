name: CI

# The merge gate. Auto-merge (v2-autobuild) is conditioned on this passing — it is
# the ONLY thing stopping "merge everything" from merging broken code. Tolerant of the
# still-evolving v2 layout: each job runs only if its target exists, so early phases
# (scaffolding, before tests exist) don't fail on absent dirs, but any suite that DOES
# exist must be green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- JS / TS: engine + web (vitest), wherever they live under v2 or v3 ----
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect JS projects with a test script
        id: detect
        run: |
          set -e
          # Any package.json under v2/ or v3/ that defines a "test" script.
          # v3 lives at packages/<name>/package.json (one level deeper than v2's
          # root-level package.json), so maxdepth 3 covers both trees.
          mapfile -t PKGS < <(find v2 v3 -maxdepth 3 -name package.json \
            -not -path '*/node_modules/*' -print 2>/dev/null || true)
          FOUND=""
          for p in "${PKGS[@]}"; do
            if node -e "process.exit(require('./'+process.argv[1]).scripts?.test?0:1)" "$p" 2>/dev/null; then
              FOUND="$FOUND $(dirname "$p")"
            fi
          done
          echo "dirs=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Projects with tests:${FOUND:- (none yet)}"

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.dirs != ''
        with:
          node-version: 22

      - name: Install pnpm
        if: steps.detect.outputs.dirs != ''
        run: npm i -g pnpm@9 || true

      - name: Compile the v3 corpus (12, 67, 103, 112)
        # `packages/corpus-compiler/output/` is gitignored (v3-D52) — a fresh
        # checkout has nothing there. `apps/web`'s own tests read it directly
        # (test/corpus-load.test.ts et al.) with NO fallback to a fixture, by
        # design (v3-D76: a fixture would keep them green after the real
        # corpus drifted) — so without this step those tests fail on every
        # clean checkout, and always did; nothing in CI ever compiled the
        # corpus before this fix. `make test`/`make build` had the identical
        # gap locally, fixed alongside this in the same commit (see
        # DECISIONS.md). Runs before the per-project loop so apps/web sees it
        # regardless of loop order.
        if: steps.detect.outputs.dirs != ''
        run: |
          set -e
          if [ -d v3/packages/corpus-compiler ]; then
            cd v3/packages/corpus-compiler
            npm ci || npm install
            for s in 12 67 103 112; do npm run compile -- "$s"; done
          fi

      - name: Build + test each JS project
        if: steps.detect.outputs.dirs != ''
        run: |
          set -e
          for d in ${{ steps.detect.outputs.dirs }}; do
            echo "::group::$d"
            cd "$GITHUB_WORKSPACE/$d"
            # Prefer pnpm if a lockfile/workspace exists, else npm.
            if [ -f pnpm-lock.yaml ] || [ -f pnpm-workspace.yaml ]; then PM="pnpm"; else PM="npm"; fi
            if [ "$PM" = "pnpm" ]; then npm i -g pnpm@9 >/dev/null 2>&1 || true; pnpm install --frozen-lockfile || pnpm install; else npm ci || npm install; fi
            # B9: the build is a REAL gate. A type-broken tree must never merge.
            # (Was `|| true`, which made this step decorative — and RUNNING.md
            # designates this workflow the sole auto-merge gate.)
            $PM run build --if-present

            # B9: a missing/empty test suite is a FAILURE, not a pass. The old
            # "No test files found → treat as pass" branch let a project ship
            # with its tests deleted.
            $PM test -- --passWithNoTests=false
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

  # ---- Laravel APIs (PHPUnit): v2/api (the working app) and v3/api (v3-D08's
  # own app). Both are real, separately-migrated Laravel apps and both must be
  # gated — until this fix, this job only ever searched under v2, so v3/api's
  # entire suite (229 tests, closing DEFECTS.md#B1/B3/B4/B7/B8/E-01 among
  # others) had never once run in CI. See DECISIONS.md for the finding. ----
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [v2/api, v3/api]
    # v3-D116: PerUserFoldLockTest/PerUserFoldLockWiringTest are the load-bearing
    # proof that v3-D32/v3-D70's deferred per-user Postgres advisory lock genuinely
    # serializes two sessions — a mock here would be exactly the vacuous-verification
    # shape this build has already shipped nine times (HANDOVER.md). Both tests skip
    # cleanly (never a false green) when no Postgres is reachable, so this service
    # is what keeps that skip from being CI's silent, permanent default. Declared for
    # both matrix legs (services run per-job, not per-matrix-value in Actions) but
    # v2/api never touches it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Laravel app
        id: has
        run: |
          if [ -f "${{ matrix.dir }}/artisan" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; echo "Laravel at: ${{ matrix.dir }}"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"; echo "no Laravel app yet at ${{ matrix.dir }}"
          fi

      - uses: shivammathur/setup-php@v2
        if: steps.has.outputs.yes == 'true'
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql

      - name: Create the throwaway Postgres database for the per-user advisory-lock tests
        # PerUserFoldLockWiringTest reads real events/atom_cache rows through a
        # migrated schema (unlike PerUserFoldLockTest, which only ever calls
        # pg_advisory_lock/unlock — no tables needed there). Migrated here, once,
        # out of band, matching the test's own "never runs migrations itself" note.
        if: steps.has.outputs.yes == 'true' && matrix.dir == 'v3/api'
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE imanapp_lock_test;"

      - uses: actions/setup-node@v4
        if: steps.has.outputs.yes == 'true' && matrix.dir == 'v3/api'
        with:
          node-version: 22

      - name: Compile the v3 corpus (12, 67, 103, 112)
        # Same gap as the Makefile's test-api3 target (see its comment):
        # OverrideHashRecomputeTest reads
        # packages/corpus-compiler/output/112/hashes.json directly, with no
        # fixture fallback by design. This job never compiled the corpus, so
        # v3/api's suite has been red on a genuinely clean checkout since the
        # commit that added that test — caught by reproducing it locally
        # (`rm -rf packages/corpus-compiler/output && make test-api3`), not
        # by a prior green CI run, because CI itself had the same gap.
        if: steps.has.outputs.yes == 'true' && matrix.dir == 'v3/api'
        run: |
          set -e
          cd v3/packages/corpus-compiler
          npm ci || npm install
          for s in 12 67 103 112; do npm run compile -- "$s"; done

      - name: Composer install + test
        if: steps.has.outputs.yes == 'true'
        working-directory: ${{ matrix.dir }}
        env:
          # package:discover runs during composer install's post-autoload hook and
          # reads config — provide .env + a key FIRST, and skip auto-scripts on install
          # so a missing app key can't fail the autoload step.
          APP_KEY: base64:2fl+Ktt0V1Sj9K0m7hHkK2n8xY3qZp1Rw6cV0aB9eD4=
          # v3-D116: matches PerUserFoldLockTest's/PerUserFoldLockWiringTest's own
          # defaults exactly (the official postgres image's own defaults), so this
          # is set unconditionally rather than only for the v3/api leg — it is a
          # no-op for v2/api, which never reads these vars.
          PGSQL_LOCK_TEST_HOST: 127.0.0.1
          PGSQL_LOCK_TEST_PORT: 5432
          PGSQL_LOCK_TEST_DATABASE: postgres
          PGSQL_LOCK_TEST_WIRING_DATABASE: imanapp_lock_test
          PGSQL_LOCK_TEST_USERNAME: postgres
          PGSQL_LOCK_TEST_PASSWORD: postgres
        run: |
          # Laravel's bootstrap/cache + storage are gitignored (generated dirs), so a
          # fresh CI checkout lacks them → package:discover fails ("must be present and
          # writable"). Recreate them before anything runs.
          mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs
          chmod -R 775 bootstrap/cache storage
          cp -n .env.example .env 2>/dev/null || true
          composer install --no-interaction --prefer-dist --no-scripts
          php artisan key:generate --force || true
          composer run-script post-autoload-dump --no-interaction || true
          php artisan config:clear || true
          # PerUserFoldLockWiringTest's own schema, migrated once against the
          # throwaway Postgres database created above — the test never migrates
          # itself (see its header).
          if [ "${{ matrix.dir }}" = "v3/api" ]; then
            DB_CONNECTION=pgsql DB_HOST=127.0.0.1 DB_PORT=5432 \
              DB_DATABASE=imanapp_lock_test DB_USERNAME=postgres DB_PASSWORD=postgres \
              php artisan migrate --force
          fi
          php artisan test

  # ---- Playwright e2e (v3/apps/web): the M5 exit-criterion suite — full-Yusuf
  # offline session, airplane-mode drill, commit-before-paint, a11y geometry.
  # It has existed since build-plan step 17/18 but this workflow never ran it
  # (HANDOVER.md item E9) — a browser-driven regression could land on main with
  # `js`/`php` both green. Separate job, not folded into `js`: it needs a
  # production `next build` + real Chromium, which is a different (slower,
  # heavier) shape than the vitest unit gate. ----
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect the e2e suite
        id: has
        run: |
          if [ -f v3/apps/web/playwright.config.ts ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"; echo "no v3/apps/web e2e suite yet"
          fi

      - uses: actions/setup-node@v4
        if: steps.has.outputs.yes == 'true'
        with:
          node-version: 22

      - name: Compile the v3 corpus (12, 67, 103, 112)
        # Same reason as the `js` job's identical step: apps/web's build
        # stages public/corpus/ from packages/corpus-compiler/output/, which a
        # fresh checkout does not have (v3-D52, gitignored).
        if: steps.has.outputs.yes == 'true'
        run: |
          set -e
          cd v3/packages/corpus-compiler
          npm ci || npm install
          for s in 12 67 103 112; do npm run compile -- "$s"; done

      - name: Install apps/web deps
        if: steps.has.outputs.yes == 'true'
        working-directory: v3/apps/web
        run: npm ci || npm install

      - name: Install Playwright's Chromium
        if: steps.has.outputs.yes == 'true'
        working-directory: v3/apps/web
        run: npx playwright install --with-deps chromium

      - name: Build + run the e2e suite
        # `npm run e2e` = `next build` (which reruns prebuild's corpus staging
        # against the just-compiled output/) then `playwright test` against the
        # production server (playwright.config.ts turns reuseExistingServer
        # off whenever CI is set, which GitHub Actions sets by default).
        if: steps.has.outputs.yes == 'true'
        working-directory: v3/apps/web
        run: npm run e2e

      - name: Upload the Playwright report on failure
        if: steps.has.outputs.yes == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: v3/apps/web/playwright-report/
          retention-days: 7
